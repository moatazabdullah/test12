<style>
  .auth0-lock-form{
    padding: 0 20px 20px 20px !important;
  }
  
   .auth0-lock.auth0-lock div.auth0-lock-name {
    font-size: 1em;
  }
  
  .auth0-lock-widget-container {
    margin: auto;
  }
  
  body .auth0-lock.auth0-lock.auth0-lock-opened .auth0-lock-widget {
    box-shadow: 0 0 40px 4px rgba(7, 7, 9, .3);
  }
    
  div.auth0-lock-overlay {  
    display: none;  
  }

  .auth0-lock.auth0-lock .auth0-lock-header-bg {
    background: #ffffff !important;
  }
  
  .auth0-lock-header-logo {
    padding: 20px;
  }
  
  .auth0-lock.auth0-lock .auth0-lock-widget-container {
    width: fit-content;
  }
  
 .auth0-lock.auth0-lock .auth0-lock-cred-pane-internal-wrapper {
    height: auto !important;
    margin: auto !important;
  }
  
  .auth0-global-message {
    text-transform: none !important;
  }
</style>

    const iframeParam = urlParams.get('iframe');
    
    if(iframeParam === 'true') {
      const dashboardLoginUrl = 'https://dashboard.checkrhq-staging.net/login';
      // Display a message detailing that SSO and social logins are not functional
      options['flashMessage'] = {
        type: 'info',
        text: `Notice: Enterprise and social logins are currently disabled in the browser extension. Please visit ${dashboardLoginUrl}`
      };
      
      // No resetting password in the web extension
      options['allowForgotPassword'] = false;
      
      // The login form loads asynchronously, so wait for it to render
      // then disable the social login section
      var interval = setInterval(() => {

     }, 50);
